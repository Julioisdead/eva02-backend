{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="card">
  <h2>Ingresar</h2>
  <form method="post">
    {% csrf_token %}
    <div class="field"><label for="username">Usuario</label><input type="text" id="username" name="username" required></div>
    <div class="field"><label for="password">Contrase&ntilde;a</label><input type="password" id="password" name="password" required></div>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
